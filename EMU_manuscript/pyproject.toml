[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membandit"
version = "0.1.0"
description = "MemoryBandit EMU intracranial EEG and reinforcement-learning manuscript analysis package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Salman E. Qasim et al." }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "patsy>=0.5",
  "mne>=1.6",
  "mne-connectivity>=0.6",
  "joblib>=1.3",
  "tqdm>=4.65",
  "nibabel>=5.1",
  "nilearn>=0.10",
  "openpyxl>=3.1",
  "h5py>=3.9",
]

[project.optional-dependencies]
oscillation = ["fooof>=1.1", "neurodsp>=2.2"]
pac = ["tensorpac>=0.6.5"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.25", "nbformat>=5.9"]
dev = ["pytest>=7.4", "pyflakes>=3.0", "nbformat>=5.9"]
# BOSC requires the external LFPAnalysis package (see README.md).
bosc = []

[tool.setuptools.package-dir]
membandit = "membandit"
rlmodels_k99 = "external/rlmodels_k99"
pyem = "external/pyem"

[tool.setuptools.packages.find]
where = [".", "external"]
include = ["membandit*", "rlmodels_k99*", "pyem*"]
