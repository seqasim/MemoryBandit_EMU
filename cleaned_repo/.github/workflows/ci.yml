name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,notebooks]"
      - name: Import smoke
        run: python -c "import membandit; from membandit import Subject, load_behavior_tables; print(membandit.__version__)"
      - name: Pyflakes (undefined names only)
        run: |
          python - <<'PY'
          import subprocess, sys
          p = subprocess.run([sys.executable, "-m", "pyflakes", "membandit"], text=True, capture_output=True)
          out = (p.stdout or "") + (p.stderr or "")
          bad = [ln for ln in out.splitlines() if "undefined name" in ln.lower()]
          print(out or "(no pyflakes findings)")
          if bad:
              print("FAIL undefined names:")
              print("\n".join(bad))
              sys.exit(1)
          print("OK: no undefined-name errors")
          PY
      - name: Validate notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          paths = list(Path("notebooks").glob("*.ipynb"))
          paths += list(Path("archive").rglob("*.ipynb"))
          assert paths, "no notebooks found"
          for p in paths:
              nbformat.read(p, as_version=4)
          print(f"OK: {len(paths)} notebooks")
          PY
