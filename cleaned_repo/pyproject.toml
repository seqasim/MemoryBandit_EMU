[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "membandit"
version = "0.1.0"
description = "MemoryBandit EMU intracranial EEG analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MemoryBandit EMU contributors" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "patsy>=0.5",
  "mne>=1.6",
  "mne-connectivity>=0.6",
  "joblib>=1.3",
  "tqdm>=4.65",
  "nibabel>=5.1",
]

[project.optional-dependencies]
oscillation = ["fooof>=1.1", "neurodsp>=2.2"]
pac = ["tensorpac>=0.6.5"]
bayes = ["pymc>=5.10", "bambi>=0.13", "arviz>=0.17", "pytensor>=2.18"]
notebooks = ["jupyter>=1.0", "ipykernel>=6.25", "nbformat>=5.9"]
dev = ["pyflakes>=3.0", "nbformat>=5.9"]
# BOSC requires the lab-only LFPAnalysis package (see external/README.md), not PyPI.
bosc = []

[tool.setuptools.packages.find]
where = ["."]
include = ["membandit*"]
